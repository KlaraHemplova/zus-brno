<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <div style="width: 600px; height: 800px">
            <!------------------------------------------------------->
            <style>
                .custom-html--img-wrapper {
                    height: 100%;
                    max-height: 1000px;
                    max-width: 1000px;
                    overflow: hidden;
                    width: 100%;
                }
                .custom-html--img-bg-wrapper {
                    align-items: center;
                    display: flex;
                    justify-content: center;
                    height: fit-content;
                    line-height: 0;
                    position: relative;
                }
                img.custom-html--img {
                    display: block;
                    max-width: 100%;
                    max-height: 100%;
                    object-fit: contain;
                    overflow: hidden;
                }
                img.custom-html--img-bg {
                    transition: opacity 0.3s ease;
                }
                .custom-html--img-bg-wrapper:has(.hover-zone:hover) img.custom-html--img-bg {
                    opacity: 0.4;
                }
                img.custom-html--img-char {
                    inset: 0;
                    max-width: 100%;
                    max-height: 100%;
                    pointer-events: none;
                    position: absolute;
                    transform-origin: var(--ox) var(--oy);
                    transition: transform 0.3s ease;
                }
                .hover-zone {
                    position: absolute;
                    left: var(--x);
                    top: var(--y);
                    width: var(--w);
                    height: var(--h);
                    z-index: 10;
                    cursor: pointer;
                    /* pro ladění odkomentuj: */
                    /* outline: 1px dashed red; */
                }
                .hover-zone:hover + img.custom-html--img-char {
                    transform: scale(1.3);
                }
            </style>

            <div class="custom-html--img-wrapper">
                <div class="custom-html--img-bg-wrapper">
                    <img
                        class="custom-html--img custom-html--img-bg"
                        src="https://github.com/KlaraHemplova/zus-brno/blob/main/bg.webp?raw=true"
                        alt=""
                    />

                    <div class="hover-zone" style="--x: 18.5%; --y: 21.4%; --w: 17.7%; --h: 24.4%;"></div>
                    <img
                        class="custom-html--img custom-html--img-char"
                        style="--ox: 27.3%; --oy: 33.6%;"
                        src="https://github.com/KlaraHemplova/zus-brno/blob/main/char_theatre.webp?raw=true"
                        alt=""
                    />

                    <div class="hover-zone" style="--x: 67.6%; --y: 9.1%; --w: 23%; --h: 27.4%;"></div>
                    <img
                        class="custom-html--img custom-html--img-char"
                        style="--ox: 79.1%; --oy: 22.8%;"
                        src="https://github.com/KlaraHemplova/zus-brno/blob/main/char_paint.webp?raw=true"
                        alt=""
                    />

                    <div class="hover-zone" style="--x: 51.1%; --y: 37.4%; --w: 18.4%; --h: 27.9%;"></div>
                    <img
                        class="custom-html--img custom-html--img-char"
                        style="--ox: 60.3%; --oy: 51.4%;"
                        src="https://github.com/KlaraHemplova/zus-brno/blob/main/char_dance.webp?raw=true"
                        alt=""
                    />

                    <div class="hover-zone" style="--x: 24.1%; --y: 58%; --w: 20.8%; --h: 20.3%;"></div>
                    <img
                        class="custom-html--img custom-html--img-char"
                        style="--ox: 34.5%; --oy: 68.2%;"
                        src="https://github.com/KlaraHemplova/zus-brno/blob/main/char_music.webp?raw=true"
                        alt=""
                    />
                </div>
            </div>
            <!------------------------------------------------------->
        </div>
    </body>
</html>
